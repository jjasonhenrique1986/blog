baseURL = 'https://blog.jjasonhenrique.com.br/'
languageCode = 'pt-BR'
defaultContentLanguage = 'pt'
title = 'Jason Henrique'
theme = 'gokarna'
enableRobotsTXT = true

# index-about.md é lido pela home (readFile) e projects.md não tem conteúdo:
# não geram páginas próprias nem entram no sitemap.
ignoreFiles = ['index-about\.md$', 'projects\.md$']

author = "Jason Henrique Martins Rodrigues"

[params]
  description = "Um blog onde compartilho sobre tecnologia principalmente sobre kubernetes e AWS."
  avatarURL = "/images/jason.jpg"
  avatarAltText = "Jason Henrique"
  accentColor = "#3498db"
  showPostsOnHomePage = "recent"
  numberPostsOnHomePage = 8
  togglePreviousAndNextButtons = true
  displayReadingTime = true
  dateFormat = "2 de January de 2006"
  metaKeywords = ["DevOps", "AWS", "Kubernetes", "Terraform", "Cloud"]
  customHeadHTML = '''
    <link rel="stylesheet" href="/css/custom.css">
    <script data-goatcounter="https://jjasonhenrique.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  '''

  socialIcons = [
    {name = "github", url = "https://github.com/jjasonhenrique1986"},
    {name = "linkedin", url = "https://www.linkedin.com/in/jasonhenrique/"},
  ]

[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  name       = "Posts"
  url        = "/posts"
  weight     = 2

[[menu.main]]
  name       = "Sobre"
  url        = "/sobre/"
  weight     = 3

[[menu.main]]
  name       = "Projetos"
  url        = "https://github.com/jjasonhenrique1986?tab=repositories"
  weight     = 4

[[menu.main]]
  name       = "Certificações"
  url        = "https://www.credly.com/users/jason-henrique/"
  weight     = 5

[[menu.main]]
  name       = "RSS"
  url        = "/index.xml"
  weight     = 6
