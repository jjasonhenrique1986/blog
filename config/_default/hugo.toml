# Configuração do blog com o tema Blowfish.
# Documentação das opções: https://blowfish.page/docs/configuration/
baseURL = "https://blog.jjasonhenrique.com.br/"
theme = "blowfish"
defaultContentLanguage = "pt-br"
enableRobotsTXT = true

# Datas sem hora nos posts valem pelo horário de Brasília (posts agendados
# saem no deploy diário das 6h do dia marcado, não às 21h do dia anterior).
timeZone = "America/Sao_Paulo"

# Português na raiz (URLs de sempre) e inglês em /en/.
defaultContentLanguageInSubdir = false

# index-about.md e index-about.en.md são lidos pela página Sobre (shortcode
# "sobre"): não geram página própria nem entram no sitemap.
ignoreFiles = ['index-about(\.en)?\.md$']

[pagination]
  pagerSize = 12

# JSON na home alimenta a busca do tema.
[outputs]
  home = ["HTML", "RSS", "JSON"]

[taxonomies]
  tag = "tags"
  category = "categories"

# As imagens ficam em static/images (URLs /images/...). Montá-las também como
# assets permite ao Blowfish gerar versões otimizadas das capas.
[module]
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"
  [[module.mounts]]
    source = "assets"
    target = "assets"
